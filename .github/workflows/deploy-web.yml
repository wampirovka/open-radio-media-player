name: Validate Open Radio Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static web files
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js
          test -f web/manifest.webmanifest
          test -f web/sw.js
          echo "Open Radio web files are present."
